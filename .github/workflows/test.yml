name: test

# Every change to the tool is tested the way it is used: the suite on the oldest
# and newest supported Python, the bash engine through shellcheck, and the built
# wheel on its own — a missing template or script only shows up once installed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Errors only, for now: the engine predates this check. Raise to warning
      # once the existing findings are cleared.
      - run: shellcheck -x --source-path=SCRIPTDIR -S error src/deployctl/scripts/*.sh src/deployctl/scripts/common/*.sh

  package:
    name: the wheel works on its own
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Install the wheel alone and render every shape
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" deployctl --version
          uv run --isolated --no-project --with "$wheel" deployctl selftest --skip-docker
