name: release

# Push a tag vX.Y.Z matching src/deployctl/__init__.py and this builds the wheel
# and publishes a GitHub release with it attached. Projects pin that tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The tag names the version in the code
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/deployctl/__init__.py)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] \
            || { echo "::error::tag $GITHUB_REF_NAME but __version__ is $version"; exit 1; }
      - run: uv build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of the CHANGELOG, without its heading.
          awk -v head="## ${GITHUB_REF_NAME#v}" '$0 == head { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "deployctl $GITHUB_REF_NAME" --notes-file notes.md
