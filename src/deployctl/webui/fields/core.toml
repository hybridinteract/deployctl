# Panel fields shown for EVERY deployment mode.
#
# target decides which file a value is written to:
#   common → config/common.env      env → config/<env>.env      app → config/app.<env>.env

[[section]]
id = "shape"
title = "Deployment shape"
description = "How many servers, where TLS terminates, and whether the databases are containers. Switching this on an environment that is already deployed is a migration, not a toggle — read the help below."

[[section.field]]
key = "MODE"
label = "Mode"
target = "env"
type = "select"
options = ["single", "cluster"]
help = "single: one server, Let's Encrypt on the host, containerized Postgres/Redis. cluster: N servers behind a load balancer, managed databases. This sets DEFAULTS only — TLS_MODE, POSTGRES_MODE and REDIS_MODE win wherever they are set explicitly below, so after changing this run Validate and fix anything it flags."

[[section]]
id = "registry"
title = "Registry login for this project — optional"
description = "Usually leave this empty: your gh login (with read:packages) or a token saved once with `deployctl access set-token` covers every project on this machine. Set it here only to use a different login for THIS project, or for a registry other than ghcr.io. Saved in config/local.env: yours, never exported, never uploaded — CI logs in with its own token."

[[section.field]]
key = "REGISTRY_USER"
label = "Your registry user"
target = "local"
placeholder = "your-github-user"
help = "Your GitHub username — who logs in. NOT the image path; that is IMAGE_REPO below."

[[section.field]]
key = "REGISTRY_TOKEN"
label = "Your registry token"
target = "local"
type = "password"
secret = true
placeholder = "ghp_…"
help = "read:packages is enough to pull; write:packages only if you use `image push` from this machine."

[section.field.guide]
title = "Generating a GitHub registry token"
link = "https://github.com/settings/tokens"
link_label = "Open GitHub → Tokens (classic)"
steps = [
  "GitHub → your avatar → Settings → Developer settings → Personal access tokens → Tokens (classic). It is the last item in the sidebar of your ACCOUNT settings, not the repo's.",
  "Generate new token (classic). Name it for this project and give it an expiry you will notice.",
  "Tick read:packages and nothing else. The servers only ever pull.",
  "Generate, then copy it straight away — GitHub shows the value once.",
  "If the organisation uses SSO: on the token's row, Configure SSO → Authorize. Skipping this is why a token that looks right fails on the host, mid-deploy.",
  "Paste it here and press Save. It is stored in config/local.env — yours, for this project only — and never sent back to this page. For every project at once, use Your access on the Setup tab (deployctl access set-token) instead.",
]
note = "Pushing from this machine (`deployctl image push`) also needs write:packages. CI needs no token at all: its workflows build and deploy with the run's own GITHUB_TOKEN."

[[section]]
id = "project"
title = "Project & domain"
description = "Identity and the public hostname. Changing PROJECT_NAME renames every container and volume — do it before the first deploy, not after."

[[section.field]]
key = "PROJECT_NAME"
label = "Project name"
target = "common"
required = true
placeholder = "myapp"
help = "Lowercase letters, digits, hyphens. Prefixes container/network/volume names."

[[section.field]]
key = "BASE_DOMAIN"
label = "Base domain"
target = "common"
required = true
placeholder = "example.com"

[[section.field]]
key = "API_SUBDOMAIN"
label = "API subdomain"
target = "env"
default = "api"
help = "The app is served at https://<subdomain>.<base domain>."

[[section]]
id = "image"
title = "Application image"
description = "Built by CI and pulled by every host. Which tag runs is not configured here: CI deploys the tag it built, and Operate deploys the one you pick."

[[section.field]]
key = "IMAGE_REPO"
label = "Image repository"
target = "common"
required = true
placeholder = "ghcr.io/your-org/your-app"

[[section]]
id = "runtime"
title = "Runtime"
description = "Per-host process counts, the memory they run in, and logging."

[[section.field]]
key = "API_WORKERS"
label = "API workers"
target = "env"
type = "number"
help = "Each is a process of ~128 MiB, plus one parent. Must fit in the API memory limit."

[[section.field]]
key = "API_MEM_LIMIT"
label = "API memory limit"
target = "env"
placeholder = "768m"
help = "Docker memory cap for the api container, e.g. 768m or 1g. Validate warns when the workers cannot fit."

[[section.field]]
key = "CELERY_WORKERS"
label = "Celery worker concurrency"
target = "env"
type = "number"
help = "Each is a process of ~128 MiB, plus one parent. Must fit in the worker memory limit."

[[section.field]]
key = "WORKER_MEM_LIMIT"
label = "Worker memory limit"
target = "env"
placeholder = "512m"
help = "Docker memory cap for celery_worker. ffmpeg jobs count against it too. Too small and the worker restarts in a loop while deploys still pass."

[[section.field]]
key = "API_CPUS"
label = "API CPU limit"
target = "env"
placeholder = "1.0"
help = "How many cores the api container may use at most, e.g. 2.0. A ceiling, not a reservation."

[[section.field]]
key = "WORKER_CPUS"
label = "Worker CPU limit"
target = "env"
placeholder = "1.0"
help = "How many cores celery_worker may use at most. Keep it below the API's so heavy jobs cannot slow the screens."

[[section.field]]
key = "FORWARDED_ALLOW_IPS"
label = "Trusted proxies (gunicorn)"
target = "env"
placeholder = "*"
help = "Who gunicorn takes X-Forwarded-For from, in its default command. Behind this stack's own nginx: 127.0.0.1 plus the compose network, e.g. 127.0.0.1,172.22.0.0/16. Ignored when project.env sets APP_COMMAND."

[[section.field]]
key = "LOG_LEVEL"
label = "Log level"
target = "env"
type = "select"
options = ["DEBUG", "INFO", "WARNING", "ERROR"]

[[section.field]]
key = "ENABLE_DOCS"
label = "Serve /docs"
target = "env"
type = "select"
options = ["false", "true"]
help = "/docs is additionally protected by the htpasswd file on each host."

[[section]]
id = "server-size"
title = "Server size"
description = "The size of one host. With it, validate adds up every container's memory and CPU limits and says when they don't fit (deployctl config budget shows the table). Leave empty to skip the check."

[[section.field]]
key = "SERVER_MEMORY"
label = "Memory"
target = "env"
placeholder = "8g"
help = "The droplet's RAM, e.g. 8g. Limits plus the system reserve above this are an error."

[[section.field]]
key = "SERVER_CPUS"
label = "vCPUs"
target = "env"
placeholder = "4"
help = "The droplet's vCPUs. CPU limits above this only warn: they are ceilings, and containers share cores."

[[section.field]]
key = "SYSTEM_RESERVE_MEMORY"
label = "Kept for the system"
target = "env"
placeholder = "700m"
help = "What the OS, Docker and sshd need outside the containers."

[[section]]
id = "services"
title = "Other services"
description = "The smaller containers. The defaults suit any server; raise them only if docker stats shows one at its limit."

[[section.field]]
key = "NGINX_MEM_LIMIT"
label = "nginx memory limit"
target = "env"
placeholder = "128m"

[[section.field]]
key = "NGINX_CPUS"
label = "nginx CPU limit"
target = "env"
placeholder = "0.25"

[[section.field]]
key = "BEAT_MEM_LIMIT"
label = "Celery Beat memory limit"
target = "env"
placeholder = "256m"

[[section.field]]
key = "BEAT_CPUS"
label = "Celery Beat CPU limit"
target = "env"
placeholder = "0.2"

[[section]]
id = "cicd"
title = "Continuous deployment"
description = "Which branch deploys. The rest of CI/CD — keys, secrets, workflows — is set up from the CI/CD tab."

[[section.field]]
key = "DEPLOY_BRANCH"
label = "Deploy branch"
target = "common"
placeholder = "main"
help = "A merge here builds the image and, with automatic deploys on, ships it. Generate workflows again after changing it."

[[section.field]]
key = "BUILD_BRANCH"
label = "Build branch"
target = "common"
placeholder = "same as the deploy branch"
help = "Only when images are built on another branch: a merge there checks and builds, and merging it into the deploy branch releases that image (release.yml). Generate workflows again after changing it."
